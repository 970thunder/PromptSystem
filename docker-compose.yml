services:
  mysql:
    image: mysql:8.4
    container_name: promptos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: promptos
    ports:
      - "${PROMPTOS_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: promptos-redis
    restart: unless-stopped
    ports:
      - "${PROMPTOS_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./src/backend
    container_name: promptos-backend
    restart: unless-stopped
    environment:
      APP_ENV: docker
      PORT: 8080
      JWT_SECRET: ${PROMPTOS_JWT_SECRET:-change-this-jwt-secret}
      JWT_EXPIRE_HOURS: ${PROMPTOS_JWT_EXPIRE_HOURS:-72}
      UPLOAD_PROVIDER: ${PROMPTOS_UPLOAD_PROVIDER:-local}
      UPLOAD_DIR: /app/uploads
      UPLOAD_BASE_URL: ${PROMPTOS_UPLOAD_BASE_URL:-http://localhost:8080}
      UPLOAD_MAX_MB: ${PROMPTOS_UPLOAD_MAX_MB:-10}
      UPLOAD_ALLOW_GIF: ${PROMPTOS_UPLOAD_ALLOW_GIF:-false}
      ALLOWED_IMAGE_DOMAINS: ${PROMPTOS_ALLOWED_IMAGE_DOMAINS:-}
      R2_ACCOUNT_ID: ${PROMPTOS_R2_ACCOUNT_ID:-}
      R2_ENDPOINT: ${PROMPTOS_R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${PROMPTOS_R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${PROMPTOS_R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${PROMPTOS_R2_BUCKET:-}
      R2_PUBLIC_URL: ${PROMPTOS_R2_PUBLIC_URL:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: promptos
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ALLOWED_ORIGIN: http://localhost:3000
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8080/api/v1/auth/github/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${PROMPTOS_BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_APP_TITLE: PromptOS
        VITE_ENABLE_PROMPT_API: "true"
    container_name: promptos-frontend
    restart: unless-stopped
    ports:
      - "${PROMPTOS_FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
  uploads_data:

