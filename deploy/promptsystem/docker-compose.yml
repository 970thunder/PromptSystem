services:
  mysql:
    image: mysql:8.4
    container_name: promptsystem-mysql
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-promptos}
      MYSQL_USER: ${MYSQL_USER:-promptos_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
    volumes:
      - promptsystem_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: promptsystem-redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "--protected-mode", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - promptsystem_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    image: promptsystem-backend:${PROMPTSYSTEM_VERSION}
    container_name: promptsystem-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    pids_limit: 128
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    env_file:
      - /opt/secrets/promptsystem/app.env
    environment:
      APP_ENV: production
      AUTH_COOKIE_ENABLED: "true"
      EMAIL_AUTH_ENABLED: ${EMAIL_AUTH_ENABLED:-true}
      PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-promptos_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-promptos}
      MYSQL_MIGRATION_USER: ${MYSQL_MIGRATION_USER:?MYSQL_MIGRATION_USER must be set}
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:?MYSQL_MIGRATION_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-8}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-4}
      DB_CONN_MAX_LIFETIME_MINUTES: ${DB_CONN_MAX_LIFETIME_MINUTES:-30}
      UPLOAD_PROVIDER: local
      UPLOAD_DIR: /app/uploads
      UPLOAD_BASE_URL: https://${PROMPTSYSTEM_DOMAIN}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-10}
      UPLOAD_MAX_CONCURRENT: ${UPLOAD_MAX_CONCURRENT:-4}
      UPLOAD_DAILY_QUOTA_MB: ${UPLOAD_DAILY_QUOTA_MB:-100}
      UPLOAD_TOTAL_QUOTA_MB: ${UPLOAD_TOTAL_QUOTA_MB:-2048}
      UPLOAD_ALLOW_GIF: ${UPLOAD_ALLOW_GIF:-false}
      ALLOWED_ORIGIN: https://${PROMPTSYSTEM_DOMAIN}
      FRONTEND_URL: https://${PROMPTSYSTEM_DOMAIN}
    ports:
      - "127.0.0.1:5092:8080"
    volumes:
      - promptsystem_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: promptsystem-frontend:${PROMPTSYSTEM_VERSION}
    container_name: promptsystem-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # nginx master binds port 80 as root; retain only that capability. The
    # image itself remains otherwise capability-free and its root filesystem is
    # read-only, with runtime directories provided by tmpfs.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,nosuid,size=16m,mode=1777
      - /var/run:rw,nosuid,size=1m
    pids_limit: 64
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    ports:
      - "127.0.0.1:3092:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  promptsystem_mysql_data:
  promptsystem_redis_data:
  promptsystem_uploads:
