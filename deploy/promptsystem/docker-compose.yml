services:
  mysql:
    image: mysql:8.4
    container_name: promptsystem-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-promptos}
      MYSQL_USER: ${MYSQL_USER:-promptos_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
    volumes:
      - promptsystem_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: promptsystem-redis
    restart: unless-stopped
    volumes:
      - promptsystem_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    image: promptsystem-backend:${PROMPTSYSTEM_VERSION}
    container_name: promptsystem-backend
    restart: unless-stopped
    env_file:
      - /opt/secrets/promptsystem/app.env
    environment:
      APP_ENV: production
      PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-promptos_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-promptos}
      MYSQL_MIGRATION_USER: ${MYSQL_MIGRATION_USER:?MYSQL_MIGRATION_USER must be set}
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:?MYSQL_MIGRATION_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOAD_PROVIDER: local
      UPLOAD_DIR: /app/uploads
      UPLOAD_BASE_URL: https://${PROMPTSYSTEM_DOMAIN}
      ALLOWED_ORIGIN: https://${PROMPTSYSTEM_DOMAIN}
      FRONTEND_URL: https://${PROMPTSYSTEM_DOMAIN}
    ports:
      - "127.0.0.1:5092:8080"
    volumes:
      - promptsystem_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: promptsystem-frontend:${PROMPTSYSTEM_VERSION}
    container_name: promptsystem-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3092:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  promptsystem_mysql_data:
  promptsystem_redis_data:
  promptsystem_uploads:
