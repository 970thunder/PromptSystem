name: security-scan

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  dependencies:
    name: dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: npm audit
        working-directory: src/frontend
        run: npm ci && npm audit --audit-level=high
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.25'
          go-package: ./...
          work-dir: src/backend

  secrets:
    name: secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  image-scan:
    name: runtime image vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: build backend image
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          load: true
          tags: promptsystem-backend:ci
          pull: true

      - name: build frontend image
        uses: docker/build-push-action@v6
        with:
          context: src/frontend
          load: true
          tags: promptsystem-frontend:ci
          pull: true
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_APP_TITLE=PromptOS
            VITE_ENABLE_PROMPT_API=true
            VITE_GITHUB_OAUTH_ENABLED=false

      - name: scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: promptsystem-backend:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: promptsystem-frontend:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  compose-policy:
    name: production compose policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: reject production hard-coded secrets and public app ports
        shell: bash
        run: |
          ! grep -nE 'APP_ENV: docker|MYSQL_USER: root|MYSQL_PASSWORD: root|MYSQL_ROOT_PASSWORD: root' deploy/promptsystem/docker-compose.yml
          grep -q '127.0.0.1:5092:8080' deploy/promptsystem/docker-compose.yml
          grep -q '127.0.0.1:3092:80' deploy/promptsystem/docker-compose.yml
          ! grep -nE 'ports:.*(3306|6379|13900|13902)' deploy/promptsystem/docker-compose.yml
          grep -q 'cap_drop:' deploy/promptsystem/docker-compose.yml
          grep -q 'read_only: true' deploy/promptsystem/docker-compose.yml
