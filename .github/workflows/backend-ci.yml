name: backend-ci

on:
  push:
    branches: [master, main, 'codex/**']
    paths:
      - 'src/backend/**'
      - 'docker-compose.yml'
      - '.env.docker.example'
  pull_request:
    paths:
      - 'src/backend/**'
      - 'docker-compose.yml'
      - '.env.docker.example'

jobs:
  go:
    name: gofmt / vet / test -race / build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: promptos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: src/backend/go.sum

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for: $unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        env:
          PROMPTOS_TEST_MYSQL_DSN: root:root@tcp(localhost:3306)/promptos_test?parseTime=true&multiStatements=true
          PROMPTOS_TEST_REDIS_ADDR: localhost:6379
        run: go test -race ./...

      - name: go build
        run: go build ./cmd/api

  migrations:
    name: migration matrix (fresh / schema / partial)
    runs-on: ubuntu-latest
    needs: go
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: promptos
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: run migration matrix test
        env:
          PROMPTOS_TEST_MYSQL_DSN: root:root@tcp(localhost:3306)/promptos?parseTime=true&multiStatements=true
        run: go test ./internal/database/ -run TestMigrationMatrix -v

  docker:
    name: docker compose config + health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: compose config
        run: docker compose config --quiet

      - name: compose up
        run: docker compose up -d --build

      - name: wait for health
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/health/ready || true)
            if [ "$status" = "200" ]; then
              echo "backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become ready"
          exit 1
