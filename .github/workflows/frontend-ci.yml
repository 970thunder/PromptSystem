name: frontend-ci

on:
  push:
    branches: [master, main, 'codex/**']
    paths:
      - 'src/frontend/**'
      - 'docker-compose.yml'
      - '.env.docker.example'
  pull_request:
    paths:
      - 'src/frontend/**'
      - 'docker-compose.yml'
      - '.env.docker.example'

jobs:
  quality:
    name: lint / test / production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm test -- --run
      - run: npm run build

  contract:
    name: frontend contract regression
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run src/stores/__tests__/prompt.spec.ts src/router/__tests__/router.spec.ts
