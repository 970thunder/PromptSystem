server {
  listen 80;
  server_name _;

  add_header X-Content-Type-Options "nosniff" always;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    # 页面内弹窗登录（2026-09-22）：共享登录组件与登录页 iframe 都在身份中心域，
    # 因此 script-src / frame-src 显式放行 id.isoumao.cn。
    # CSP 只加在 SPA 文档上：/api/ 与 /uploads/ 的响应保持原有头，
    # 否则弹窗收尾页（服务端返回的内联脚本）会被 frame-ancestors 'none' 与 script-src 拦掉。
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://id.isoumao.cn; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://avatars.githubusercontent.com; font-src 'self' data:; connect-src 'self'; frame-src 'self' https://id.isoumao.cn;" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri/ /index.html;
  }
}
