server {
  listen 80;
  server_name _;

  # Enforced after the bundle was audited: all scripts and network connections
  # are same-origin, while Vue/Naive UI still require inline style attributes.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://avatars.githubusercontent.com; font-src 'self' data:; connect-src 'self';" always;
  add_header X-Content-Type-Options "nosniff" always;

  root /usr/share/nginx/html;
  index index.html;

  # 文本类响应统一 gzip：未压缩时首屏 JS 约 1.5MB，gzip 后约 1/4。
  # gzip_proxied any 让上游（backend JSON）响应同样被压缩。
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 带 hash 的构建产物内容不可变，可安全长缓存（repeat visit 零下载）。
  # 注意：nginx 的 add_header 不从 server 级继承到含 add_header 的 location，
  # 因此安全头必须在此逐条重复。
  location /assets/ {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://avatars.githubusercontent.com; font-src 'self' data:; connect-src 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA 入口必须始终回源校验，禁止长缓存。
  location = /index.html {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://avatars.githubusercontent.com; font-src 'self' data:; connect-src 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
